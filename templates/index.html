<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-container">
    <div class="login-left">
        <h1>🌿 HealthTrack</h1>
        <p style="color: white; font-size: 1.2rem; max-width: 400px;">
            Empowering communities through digital health literacy. <br>
            <span style="color: var(--neon-green); font-family: 'Fira Code', monospace;">> Initialize Wellness Protocol...</span>
        </p>
    </div>

    <div class="login-right">
        <div class="login-box">
            <h2>SYSTEM ACCESS</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Enter credentials to access dashboard.</p>
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="user_id" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Initialize Session</button>
            </form>

            <div style="margin-top: 2rem; padding: 1rem; background: rgba(0,0,0,0.5); border-radius: 8px; text-align: center; border: 1px dashed var(--neon-cyan);">
                <small style="color: var(--neon-cyan); font-family: 'Fira Code', monospace;">
                    [DEMO] user: student1 | pass: pass123
                </small>
            </div>
        </div>
    </div>
</div>

</body>
</html>
